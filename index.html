<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Preconnect + a real <link> (not a CSS @import, which the browser can't
         discover until after it's downloaded and parsed the whole stylesheet)
         so these fonts start loading as early as possible and the fallback-to-
         custom-font swap happens sooner, before more content has painted. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Bidzo — Pārdod vairāk. Pērc gudrāk.</title>
    <script>
      // Applies the saved theme before first paint, so there's never a flash
      // of the wrong theme while React loads. Light mode is temporarily
      // disabled site-wide (see LIGHT_MODE_ENABLED in ThemeContext.jsx), so
      // this always applies dark for now regardless of any earlier choice
      // saved in localStorage -- keep this in sync with that flag.
      (function () {
        try {
          document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
