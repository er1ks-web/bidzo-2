<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Bidzo — Latvijas izsoles platforma</title>
    <script>
      // Applies the saved theme before first paint, so there's never a flash
      // of the wrong theme while React loads. Light mode is temporarily
      // disabled site-wide (see LIGHT_MODE_ENABLED in ThemeContext.jsx), so
      // this always applies dark for now regardless of any earlier choice
      // saved in localStorage -- keep this in sync with that flag.
      (function () {
        try {
          document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
